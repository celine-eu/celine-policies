version: "3"

# Everything driven from this taskfile targets the local dev realm, where the
# `${SVC_X_SECRET:-svc-x}` fallbacks in clients.yaml are exactly what we want.
# `keycloak sync` defaults to ENV=prod and refuses those placeholders, so dev
# opts out here rather than the code defaulting to the unsafe side.
env:
  ENV: dev

includes:
  local:
    taskfile: taskfile.local.yaml
    optional: true
    flatten: true

tasks:
  setup:
    desc: Setup
    cmds:
      - uv sync

  run:
    desc: "Run development server"
    cmds:
      - .venv/bin/uvicorn celine.mqtt_auth.main:create_app --reload --host 0.0.0.0 --port 8009

  debug:
    desc: "Run development server with debugger"
    cmds:
      - DEBUG_ATTACH=nowait DEBUG_PORT=48009 .venv/bin/uvicorn celine.mqtt_auth.main:create_app --reload --host 0.0.0.0 --port 8009

  test:
    desc: "Run test"
    cmds:
      - uv run pytest

  release:
    cmds:
      - uv run semantic-release -v version --no-vcs-release
      - git push
      - git push --tags

  keycloak:bootstrap:
    cmds:
      - uv run celine-policies keycloak bootstrap --admin-user admin --admin-password admin

  keycloak:sync:
    deps: [keycloak:bootstrap]
    cmds:
      # The master admin, not celine-admin-cli: granting a client realm-management
      # roles (svc-provisioning, ADR-0007) is refused 403 to celine-admin-cli, which
      # Keycloak lets map none of them although it holds them (measured 2026-09-15).
      - uv run celine-policies keycloak sync --admin-user admin --admin-password admin

  keycloak:dev-users:
    deps: [keycloak:bootstrap]
    desc: "Create the development users (admin, manager, editor, viewer)"
    cmds:
      - uv run celine-policies keycloak seed-dev-users

  keycloak:sync-users:
    deps: [keycloak:bootstrap]
    desc: "Sync Keycloak users from REC registry YAML"
    vars:
      REC_YAML: '{{.CLI_ARGS | default "../rec-registry/recs/rec-example.yaml"}}'
    cmds:
      - uv run celine-policies keycloak sync-users {{.REC_YAML}} --password "demo" --mock

  keycloak:sync-users:registry:
    deps: [keycloak:bootstrap]
    desc: "Sync Keycloak users from the live rec-registry (every community)"
    # The file-driven task above reconciles a snapshot, so it leaves out
    # everybody onboarding has approved since the export. This one reads the
    # registry. `celine-cli`'s secret is the clients.yaml placeholder in dev —
    # which is exactly what ENV=dev at the top of this file allows.
    vars:
      REGISTRY_URL: '{{.CLI_ARGS | default "http://api.celine.localhost/rec-registry"}}'
    cmds:
      - uv run celine-policies keycloak sync-users --from-registry
        --registry-url {{.REGISTRY_URL}} --registry-client-secret celine-cli
        --password "demo" --mock

  keycloak:sync-users:check:
    desc: "Report members whose Keycloak state does not match the registry"
    vars:
      REGISTRY_URL: '{{.CLI_ARGS | default "http://api.celine.localhost/rec-registry"}}'
    cmds:
      - uv run celine-policies keycloak sync-users --from-registry
        --registry-url {{.REGISTRY_URL}} --registry-client-secret celine-cli
        --check

  keycloak:sync-orgs:
    deps: [keycloak:bootstrap]
    desc: "Sync Keycloak organizations from owners yaml"
    vars:
      REC_YAML: '{{.CLI_ARGS | default "../dataset-api/owners.yaml"}}'
    cmds:
      - uv run celine-policies keycloak sync-orgs {{.REC_YAML}}
