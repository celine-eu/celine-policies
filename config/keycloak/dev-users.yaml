# Development users, with their username as password.
#
# `celine-policies keycloak seed-dev-users` creates them, and refuses outside a development
# ENV. Exactly two levels of authority (ADR-0012): the realm role `platform-admin`, and an
# organization's own groups, valid only inside it. No user here is in a realm group.
#
#   admin       platform-admin; also admins of the two example organizations, as a platform
#               administrator from the dev team would be. The local stack depends on it.
#   org-admin   admins of example_rec only: an organization administrator who is NOT a
#               platform administrator.
#   org-viewer  viewers of example_rec only: a member.
#
# The organizations are created by `sync-users` from the example REC; seed-dev-users refuses
# one that does not exist yet. A user is created once and its memberships and role are kept;
# a password is never reset.
users:
  - username: admin
    email: admin@celine.localhost
    first_name: Admin
    last_name: User
    password: admin
    realm_roles: [platform-admin]
    organizations:
      example_rec: admins
      example_dso: admins
  - username: org-admin
    email: org-admin@celine.localhost
    first_name: Organization
    last_name: Admin
    password: org-admin
    organizations:
      example_rec: admins
  - username: org-viewer
    email: org-viewer@celine.localhost
    first_name: Organization
    last_name: Viewer
    password: org-viewer
    organizations:
      example_rec: viewers
