# REC Keycloak email theme
#
# Overrides the three emails a participant actually receives — the invitation
# and operator reset (executeActions), forgot password (password-reset) and
# email verification — and inherits every other email from `base`.

parent=base

locales=it,en,es

# The same branding the login theme uses. Emails name the platform, not a
# community: realmName (the realm's display name) first, then BRAND_NAME.
brandName=${env.BRAND_NAME:CELINE}
termsUrl=${env.TERMS_URL:#}
privacyUrl=${env.PRIVACY_URL:#}
