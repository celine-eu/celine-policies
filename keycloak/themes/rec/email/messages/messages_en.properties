# REC email theme - English
#
# Subjects are fixed keys Keycloak looks up, and take no parameters. The
# executeActions subject serves both the invitation and the operator reset, so
# it is worded to fit both. A changed address is confirmed through Keycloak's
# send-verify-email (email-verification, emailVerificationSubject), never an
# actions email, so it never reads "set your password". The recVerify keys
# serve a first verification and a changed address alike. Keys starting `rec` are this theme's own.
# A single quote is written '' (MessageFormat).

executeActionsSubject=Set your password
passwordResetSubject=Reset your password
emailVerificationSubject=Confirm your email address

recInvitationTitle=Welcome to {0}
recInvitationIntro=An account has been created for you on {0}. To start using it, choose your password.
recInvitationButton=Set your password
recInvitationAfter=Once your password is set, go back to the application and sign in with your email address and your new password.
recInvitationIgnore=If you were not expecting this email, you can ignore it.

recResetTitle=Reset your password
recResetIntro=A new password has been requested for your {0} account. Use the link below to choose one.
recResetButton=Choose a new password
recResetAfter=Once it is set, go back to the application and sign in with your new password.
recResetIgnore=If you did not ask for this, ignore this email: your password stays as it is.

recForgotIntro=Someone asked to reset the password of your {0} account. If it was you, use the link below.

recVerifyTitle=Confirm your email address
recVerifyIntro=Your {0} account uses this email address. Confirm it with the link below: until you do, the address stays unverified.
recVerifyButton=Confirm email address
recVerifyIgnore=If you do not recognise this account, ignore this email.

recLinkExpiry=The link can be used once and expires in {0}.
recLinkFallback=If the button does not work, copy this address into your browser:
recFooter=This email was sent by {0}.
recTerms=Terms
recPrivacy=Privacy
