# REC email theme - Español
#
# Subjects are fixed keys Keycloak looks up, and take no parameters. The
# executeActions subject serves both the invitation and the operator reset, so
# it is worded to fit both. Keys starting `rec` are this theme's own.
# A single quote is written '' (MessageFormat).

executeActionsSubject=Establece tu contraseña
passwordResetSubject=Restablece tu contraseña
emailVerificationSubject=Confirma tu dirección de correo electrónico

recInvitationTitle=Te damos la bienvenida a {0}
recInvitationIntro=Se ha creado una cuenta para ti en {0}. Para empezar a usarla, elige tu contraseña.
recInvitationButton=Establecer contraseña
recInvitationAfter=Cuando hayas establecido la contraseña, vuelve a la aplicación e inicia sesión con tu correo electrónico y la nueva contraseña.
recInvitationIgnore=Si no esperabas este correo, puedes ignorarlo.

recResetTitle=Restablece tu contraseña
recResetIntro=Se ha solicitado una nueva contraseña para tu cuenta de {0}. Usa el enlace de abajo para elegirla.
recResetButton=Elegir una nueva contraseña
recResetAfter=Cuando la hayas establecido, vuelve a la aplicación e inicia sesión con la nueva contraseña.
recResetIgnore=Si no lo has solicitado, ignora este correo: tu contraseña no cambia.

recForgotIntro=Alguien ha pedido restablecer la contraseña de tu cuenta de {0}. Si has sido tú, usa el enlace de abajo.

recVerifyTitle=Confirma tu dirección de correo electrónico
recVerifyIntro=Confirma que esta dirección pertenece a tu cuenta de {0}.
recVerifyButton=Confirmar dirección de correo
recVerifyIgnore=Si no has creado esta cuenta, ignora este correo.

recLinkExpiry=El enlace se puede usar una sola vez y caduca en {0}.
recLinkFallback=Si el botón no funciona, copia esta dirección en tu navegador:
recFooter=Este correo ha sido enviado por {0}.
recTerms=Términos
recPrivacy=Privacidad
