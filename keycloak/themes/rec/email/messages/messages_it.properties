# REC email theme - Italiano
#
# Subjects are fixed keys Keycloak looks up, and take no parameters. The
# executeActions subject serves both the invitation and the operator reset, so
# it is worded to fit both. Keys starting `rec` are this theme's own.
# A single quote is written '' (MessageFormat).

executeActionsSubject=Imposta la tua password
passwordResetSubject=Reimposta la tua password
emailVerificationSubject=Conferma il tuo indirizzo email

recInvitationTitle=Benvenuto su {0}
recInvitationIntro=È stato creato un account per te su {0}. Per iniziare a usarlo, scegli la tua password.
recInvitationButton=Imposta la password
recInvitationAfter=Dopo aver impostato la password, torna all''applicazione e accedi con il tuo indirizzo email e la nuova password.
recInvitationIgnore=Se non ti aspettavi questa email, puoi ignorarla.

recResetTitle=Reimposta la tua password
recResetIntro=È stata richiesta una nuova password per il tuo account {0}. Usa il link qui sotto per sceglierla.
recResetButton=Scegli una nuova password
recResetAfter=Una volta impostata, torna all''applicazione e accedi con la nuova password.
recResetIgnore=Se non l''hai richiesto tu, ignora questa email: la tua password resta invariata.

recForgotIntro=Qualcuno ha chiesto di reimpostare la password del tuo account {0}. Se sei stato tu, usa il link qui sotto.

recVerifyTitle=Conferma il tuo indirizzo email
recVerifyIntro=Conferma che questo indirizzo appartiene al tuo account {0}.
recVerifyButton=Conferma indirizzo email
recVerifyIgnore=Se non hai creato questo account, ignora questa email.

recLinkExpiry=Il link si può usare una sola volta e scade tra {0}.
recLinkFallback=Se il pulsante non funziona, copia questo indirizzo nel browser:
