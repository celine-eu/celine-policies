networks:
  celine_security_net:

services:
  keycloak-sync:
    build:
      context: .
      dockerfile: Dockerfile
    restart: "no"
    volumes:
      - ./clients.yaml:/app/clients.yaml:ro
    depends_on:
      keycloak:
        condition: service_healthy
    environment:
      # This stack is a local dev realm — keycloak runs with admin/admin and a
      # dev-file DB — so the `${SVC_X_SECRET:-svc-x}` fallbacks in clients.yaml
      # are exactly what is wanted. `sync` defaults to ENV=prod and refuses
      # them, and refused here before this was set: dev opts out explicitly
      # rather than the code defaulting to the unsafe side. Same rationale as
      # taskfile.yaml's file-level `env: ENV: dev`.
      - ENV=dev
      - CELINE_KEYCLOAK_SECRETS_FILE=/tmp/.secrets.yaml
    entrypoint: [ "/bin/sh", "-euc" ]
    command:
      - |
        celine-policies keycloak bootstrap --admin-user admin --admin-password admin && \
        celine-policies keycloak sync --secrets-file /tmp/.secrets.yaml
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "keycloak.celine.localhost:host-gateway"
      - "api.celine.localhost:host-gateway"

  sync-users:
    build:
      context: .
      dockerfile: Dockerfile
    restart: "no"
    volumes:
      - ../rec-registry/recs/rec-example.yaml:/app/rec-example.yaml:ro
    depends_on:
      keycloak-sync:
        condition: service_completed_successfully
    entrypoint: [ "/bin/sh", "-euc" ]
    command:
      - |
        celine-policies keycloak sync-users /app/rec-example.yaml --admin-user admin --admin-password admin --password test --no-temporary --mock && \
        celine-policies keycloak set-user-organization admin  --admin-user admin --admin-password admin  --organization example_dso --group admins && \
        celine-policies keycloak set-user-organization viewer --admin-user admin --admin-password admin  --organization example_dso --group viewers && \
        celine-policies keycloak set-user-organization admin  --admin-user admin --admin-password admin  --organization example_rec --group admins && \
        celine-policies keycloak set-user-organization viewer --admin-user admin --admin-password admin  --organization example_rec --group viewers
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "keycloak.celine.localhost:host-gateway"
      - "api.celine.localhost:host-gateway"

  mqtt_auth:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8009:8009"
      - "48009:48009"
    volumes:
      # Mount policies for hot-reload during development
      - ./policies:/app/policies:ro
    environment:
      - CELINE_POLICIES_DATA_DIR=/app/policies
    healthcheck:
      test:
        [
          "CMD",
          ".venv/bin/python",
          "-c",
          "import httpx;
            httpx.get('http://localhost:8009/health').raise_for_status()",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      keycloak-sync:
        condition: service_completed_successfully
      sync-users:
        condition: service_completed_successfully
    networks:
      - celine_security_net
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "keycloak.celine.localhost:host-gateway"
      - "api.celine.localhost:host-gateway"

  provisioning:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - uvicorn
      - celine.provisioning.main:create_app
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "8010"
    environment:
      # It authenticates as svc-provisioning, whose realm-wide grant is what
      # ADR-0007 is about. `keycloak-sync` creates that client and records the
      # secret, which is why the dependency below is on its *completion* and not
      # on Keycloak being up: this service cannot bootstrap the realm it
      # authenticates against.
      - ENV=dev
      - CELINE_KEYCLOAK_ADMIN_CLIENT_ID=svc-provisioning
      - CELINE_KEYCLOAK_ADMIN_CLIENT_SECRET=svc-provisioning
      - CELINE_PROVISIONING_REGISTRY_CLIENT_ID=svc-provisioning
      - CELINE_PROVISIONING_REGISTRY_CLIENT_SECRET=svc-provisioning
      # Left unset: `POST /reconcile/{community}` and the lifecycle calls refuse
      # with a message naming the variable rather than the process failing to
      # start. The upsert needs no registry, and a local stack that only
      # onboards should not be held up by a reconcile it never calls.
      # - CELINE_PROVISIONING_REGISTRY_URL=http://rec-registry:8000
    # Deliberately **not** published to the host. The whole security argument
    # for a service holding manage-users and manage-realm is that nothing
    # outside the network reaches it — see ADR-0007. Adding a `ports:` entry
    # here, or a route to it in the ingress, converts that credential into an
    # internet-facing one.
    expose:
      - "8010"
    healthcheck:
      test:
        [
          "CMD",
          ".venv/bin/python",
          "-c",
          "import httpx;
            httpx.get('http://localhost:8010/health').raise_for_status()",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      keycloak-sync:
        condition: service_completed_successfully
    networks:
      - celine_security_net
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "keycloak.celine.localhost:host-gateway"
      - "api.celine.localhost:host-gateway"

  mosquitto:
    image: ghcr.io/lhns/mosquitto-go-auth:3.3.0-mosquitto_2.0.22
    ports:
      - "1883:1883"
      - "1884:1884"
    volumes:
      - ./config/mosquitto:/etc/mosquitto:ro
      - ./data/mosquitto/data:/data:rw
      - ./data/mosquitto/logs:/logs:rw
    depends_on:
      redis:
        condition: service_started
      mqtt_auth:
        condition: service_healthy
    networks:
      - celine_security_net
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "keycloak.celine.localhost:host-gateway"
      - "api.celine.localhost:host-gateway"

  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    command: >
      redis-server --appendonly yes --save 60 1000 --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    networks:
      - celine_security_net

  keycloak:
    build:
      context: ./keycloak
      dockerfile: Dockerfile

    command: start-dev --import-realm
    environment:
      KC_DB: dev-file

      # pgsql
      # KC_DB: postgres
      # KC_DB_URL: jdbc:postgresql://db:5432/keycloak
      # KC_DB_USERNAME: keycloak
      # KC_DB_PASSWORD: keycloak

      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin

      KC_HTTP_ENABLED: "true"
      KC_HTTP_PORT: 8080
      KC_HEALTH_ENABLED: "true"

      KC_HOSTNAME: keycloak.celine.localhost
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "false"
      KC_HOSTNAME_STRICT: "false"

      KC_PROXY: edge
      KC_PROXY_HEADERS: forwarded
    volumes:
      - ./config/keycloak/import:/opt/keycloak/data/import:ro
      - ./keycloak/themes/rec:/opt/keycloak/themes/rec:ro
    networks:
      - celine_security_net
    healthcheck:
      test: [ "CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000" ]
      interval: 5s
      timeout: 5s
      retries: 15
    ports:
      - 8080:8080

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.11.0
    restart: unless-stopped
    command:
      - "--config=/etc/oauth2-proxy/oauth2-proxy.cfg"
    volumes:
      - ./config/oauth2-proxy/oauth2-proxy.cfg:/etc/oauth2-proxy/oauth2-proxy.cfg:ro
    networks:
      - celine_security_net
    depends_on:
      keycloak:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "keycloak.celine.localhost:host-gateway"
    ports:
      - 4180:4180
