networks:
  celine_security_net:

services:
  keycloak-sync:
    build:
      context: .
      dockerfile: Dockerfile
    restart: "no"
    volumes:
      - ./clients.yaml:/app/clients.yaml:ro
      - ./platform.yaml:/app/platform.yaml:ro
    depends_on:
      keycloak:
        condition: service_healthy
    environment:
      # This stack is a local dev realm — keycloak runs with admin/admin and a
      # dev-file DB — so the `${SVC_X_SECRET:-svc-x}` fallbacks in clients.yaml
      # are exactly what is wanted. `sync` defaults to ENV=prod and refuses
      # them, and refused here before this was set: dev opts out explicitly
      # rather than the code defaulting to the unsafe side. Same rationale as
      # taskfile.yaml's file-level `env: ENV: dev`.
      - ENV=dev
      - CELINE_KEYCLOAK_SECRETS_FILE=/tmp/.secrets.yaml
    entrypoint: [ "/bin/sh", "-euc" ]
    command:
      - |
        celine-policies keycloak bootstrap --admin-user admin --admin-password admin && \
        celine-policies keycloak sync --secrets-file /tmp/.secrets.yaml
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "keycloak.celine.localhost:host-gateway"
      - "api.celine.localhost:host-gateway"

  sync-users:
    build:
      context: .
      dockerfile: Dockerfile
    restart: "no"
    volumes:
      - ../rec-registry/recs/rec-example.yaml:/app/rec-example.yaml:ro
    depends_on:
      keycloak-sync:
        condition: service_completed_successfully
    entrypoint: [ "/bin/sh", "-euc" ]
    command:
      - |
        celine-policies keycloak sync-users /app/rec-example.yaml --admin-user admin --admin-password admin --password test --no-temporary --mock && \
        celine-policies keycloak set-user-organization admin  --admin-user admin --admin-password admin  --organization example_dso --group admins && \
        celine-policies keycloak set-user-organization viewer --admin-user admin --admin-password admin  --organization example_dso --group viewers && \
        celine-policies keycloak set-user-organization admin  --admin-user admin --admin-password admin  --organization example_rec --group admins && \
        celine-policies keycloak set-user-organization viewer --admin-user admin --admin-password admin  --organization example_rec --group viewers
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "keycloak.celine.localhost:host-gateway"
      - "api.celine.localhost:host-gateway"

  mqtt_auth:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8009:8009"
      - "48009:48009"
    volumes:
      # Mount policies for hot-reload during development
      - ./policies:/app/policies:ro
    environment:
      - CELINE_POLICIES_DATA_DIR=/app/policies
    healthcheck:
      test:
        [
          "CMD",
          ".venv/bin/python",
          "-c",
          "import httpx;
            httpx.get('http://localhost:8009/health').raise_for_status()",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      keycloak-sync:
        condition: service_completed_successfully
      sync-users:
        condition: service_completed_successfully
    networks:
      - celine_security_net
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "keycloak.celine.localhost:host-gateway"
      - "api.celine.localhost:host-gateway"

  provisioning:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - uvicorn
      - celine.provisioning.main:create_app
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "8010"
    environment:
      # It authenticates as svc-provisioning, whose realm-wide grant is what
      # ADR-0007 is about. `keycloak-sync` creates that client and records the
      # secret, which is why the dependency below is on its *completion* and not
      # on Keycloak being up: this service cannot bootstrap the realm it
      # authenticates against.
      - ENV=dev
      - CELINE_KEYCLOAK_ADMIN_CLIENT_ID=svc-provisioning
      - CELINE_KEYCLOAK_ADMIN_CLIENT_SECRET=svc-provisioning
      - CELINE_PROVISIONING_REGISTRY_CLIENT_ID=svc-provisioning
      - CELINE_PROVISIONING_REGISTRY_CLIENT_SECRET=svc-provisioning
      # **The registry, and it is not optional for as much as it looks.**
      #
      # `POST /reconcile/{community}` needs it — and so do `invitation` and
      # `disable`, which resolve `(community, key)` through the export. So a
      # stack that "only onboards" still needs it the first time a REC operator
      # disables somebody: measured on the demo3 deployment 2026-09-12, where
      # `disable` answered `502 No registry configured` while the upsert worked.
      # Unset is still a clear refusal naming this variable rather than a
      # failure to start, which is why it stays overridable and empty-able.
      #
      # `172.17.0.1:8004` is where `../rec-registry` answers on a celine-dev
      # machine, whichever half of it is running — the platform's own convention
      # (`../../config/caddy/Caddyfile` reaches every service as `host-gw:<port>`
      # for the same reason). **Not `http://rec-registry:8000`**, which was the
      # commented suggestion here and resolves from nowhere: that service is in
      # its own compose project and nothing joins this network from another one.
      - CELINE_PROVISIONING_REGISTRY_URL=${CELINE_PROVISIONING_REGISTRY_URL:-http://172.17.0.1:8004}
      # **Invitations.** Keycloak sends them; these decide the link and who may
      # receive one. `dev` emails only EMAIL_DEV_RECIPIENTS and logs a WARNING
      # for everyone else — the same list `mailpit` below relays. Keycloak's own
      # SMTP has to point at `mailpit:1025` for any of it to arrive there: a realm
      # created from the dev import does; an existing one needs it set once, see
      # docs/deployment.md. The redirect must be registered on `oauth2_proxy`.
      - CELINE_PROVISIONING_EMAIL_MODE=${CELINE_PROVISIONING_EMAIL_MODE:-dev}
      - EMAIL_DEV_RECIPIENTS=${EMAIL_DEV_RECIPIENTS:-}
      - CELINE_PROVISIONING_INVITE_REDIRECT_URI=${CELINE_PROVISIONING_INVITE_REDIRECT_URI:-http://webapp.celine.localhost/}
    # **Published, and the security argument moved rather than went away.**
    #
    # `expose` alone made this unreachable by anything outside *this compose
    # project*, which is not the boundary ADR-0007 argues from. Nothing joins
    # `celine_security_net` from another project, so `http://provisioning:8010`
    # resolved from no caller this platform actually has: `../onboarding` runs
    # in a project and a network of its own, and on a developer's machine it as
    # often runs from source on the host with no Docker network at all.
    # Measured on the demo3 deployment, 2026-09-12 — **neither half of
    # onboarding could resolve the name**, so the login step could not be
    # exercised anywhere.
    #
    # So the port is published, and the route added in
    # `../../config/caddy/Caddyfile` is a **host of its own** —
    # `provisioning.internal.celine.localhost`, never a path under the public
    # `api.celine.localhost`. What ADR-0007 rests on is unchanged and is still
    # not enforceable from this file: **nothing outside the deployment may
    # reach this service.** On a dev machine that boundary is the machine; in a
    # real deployment it is whatever keeps that hostname and this port off the
    # internet, and it is the thing to establish before this ships anywhere.
    #
    # Authorisation is by scope either way — a caller presents a token carrying
    # `provisioning.*` or gets a 403. That was always defence in depth rather
    # than the control, and locally it is now what the reach of this port rests
    # on.
    ports:
      - "8010:8010"
    healthcheck:
      test:
        [
          "CMD",
          ".venv/bin/python",
          "-c",
          "import httpx;
            httpx.get('http://localhost:8010/health').raise_for_status()",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      keycloak-sync:
        condition: service_completed_successfully
    networks:
      - celine_security_net
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "keycloak.celine.localhost:host-gateway"
      - "api.celine.localhost:host-gateway"

  # Keycloak's outgoing mail in dev. Every message is kept in the UI on :8025 and
  # none is delivered — unless EMAIL_DEV_RECIPIENTS and MAILPIT_RELAY_HOST are
  # both set, and then only those addresses are relayed. `config/mailpit/start.sh`
  # builds the anchored, escaped match; the provisioning service applies the
  # same list before it asks Keycloak to send anything.
  #
  # Keycloak reaches it as `mailpit:1025` on this network — the dev import's
  # `smtpServer` says so, for a realm created from it. SMTP is also published on
  # the host's 1025 so other workspace services (`../onboarding`'s `SMTP_HOST`)
  # can use it through the host gateway, `172.17.0.1:1025`. Published on every
  # interface for that reason: a 127.0.0.1 binding is not reachable from a
  # container. It accepts any credentials and relays nothing by default.
  mailpit:
    image: axllent/mailpit:v1.31.1
    restart: unless-stopped
    entrypoint: [ "/bin/sh", "/start.sh" ]
    environment:
      - EMAIL_DEV_RECIPIENTS=${EMAIL_DEV_RECIPIENTS:-}
      - MAILPIT_RELAY_HOST=${MAILPIT_RELAY_HOST:-}
      - MAILPIT_RELAY_PORT=${MAILPIT_RELAY_PORT:-587}
      - MAILPIT_RELAY_USERNAME=${MAILPIT_RELAY_USERNAME:-}
      - MAILPIT_RELAY_PASSWORD=${MAILPIT_RELAY_PASSWORD:-}
    volumes:
      - ./config/mailpit/start.sh:/start.sh:ro
    networks:
      - celine_security_net
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # UI and API

  mosquitto:
    image: ghcr.io/lhns/mosquitto-go-auth:3.3.0-mosquitto_2.0.22
    ports:
      - "1883:1883"
      - "1884:1884"
    volumes:
      - ./config/mosquitto:/etc/mosquitto:ro
      - ./data/mosquitto/data:/data:rw
      - ./data/mosquitto/logs:/logs:rw
    depends_on:
      redis:
        condition: service_started
      mqtt_auth:
        condition: service_healthy
    networks:
      - celine_security_net
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "keycloak.celine.localhost:host-gateway"
      - "api.celine.localhost:host-gateway"

  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    command: >
      redis-server --appendonly yes --save 60 1000 --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    networks:
      - celine_security_net

  # Keycloak's database, created the way every other celine service creates its
  # own — `../onboarding`'s `init-db` is the same nine lines. It is a `CREATE
  # DATABASE` and nothing else: the schema is Keycloak's own to migrate, and it
  # does that on every start.
  keycloak-db:
    image: postgres:16-alpine
    restart: "no"
    environment:
      PGHOST: ${DB_HOST:-172.17.0.1}
      PGPORT: ${DB_PORT:-15432}
      PGUSER: ${DB_USER:-postgres}
      PGPASSWORD: ${DB_PASSWORD:-securepassword123}
    entrypoint: >
      sh -c '
        until pg_isready; do sleep 1; done
        psql -tc "SELECT 1 FROM pg_database WHERE datname = '"'"'keycloak'"'"'" | grep -q 1 ||
          psql -c "CREATE DATABASE keycloak"
        echo "Database keycloak ready"
      '
    networks:
      - celine_security_net

  keycloak:
    build:
      context: ./keycloak
      dockerfile: Dockerfile

    command: start-dev --import-realm
    environment:
      # **The platform's Postgres, like every other celine service.**
      #
      # This was `KC_DB: dev-file` until 2026-09-12, with the Postgres block
      # commented out beside it pointing at a `db:5432` service that does not
      # exist in this file — written for a database that was never added. So the
      # realm lived in H2, inside the container's writable layer, and Keycloak
      # was the one service on this platform whose data was not in
      # `../celine-pipelines`' `datasets-db`: `celine-community`,
      # `celine-forecasting`, `celine-grid`, `celine-roi`, `flexibility-api` and
      # `../onboarding` all keep theirs there.
      #
      # What that cost: the realm — clients, organizations, and every
      # participant account with the password its owner chose — was discarded by
      # `up -d --build keycloak`, which is exactly what applying a bump to
      # `keycloak/version.txt` *is*. A named volume on `data/h2` fixed the
      # symptom on 2026-09-12 and is gone again with this, because H2 dev-file
      # is also not a supported upgrade path: the 26.6.0 → 26.7.3 migration ran
      # on it that day and worked, on a path Keycloak does not support.
      #
      # `172.17.0.1:15432`, not a service name: `datasets-db` is in another
      # compose project and nothing joins this network from one. That is the
      # platform's own convention — `../../config/caddy/Caddyfile` reaches every
      # service the same way, and the defaults below are the ones every other
      # service's `db-create` job already uses.
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://${DB_HOST:-172.17.0.1}:${DB_PORT:-15432}/keycloak
      KC_DB_USERNAME: ${DB_USER:-postgres}
      KC_DB_PASSWORD: ${DB_PASSWORD:-securepassword123}

      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin

      KC_HTTP_ENABLED: "true"
      KC_HTTP_PORT: 8080
      KC_HEALTH_ENABLED: "true"

      KC_HOSTNAME: keycloak.celine.localhost
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "false"
      KC_HOSTNAME_STRICT: "false"

      KC_PROXY: edge
      KC_PROXY_HEADERS: forwarded
    volumes:
      # **No volume for the database, because the database is not here.** A
      # `keycloak-data:/opt/keycloak/data/h2` volume stood here for a few hours
      # on 2026-09-12, between finding that a container rebuild discarded the
      # realm and moving the realm to Postgres. Its durability now belongs to
      # `celine-pipelines_postgres_data`, with every other service's.
      - ./config/keycloak/import:/opt/keycloak/data/import:ro
      - ./keycloak/themes/rec:/opt/keycloak/themes/rec:ro
    depends_on:
      keycloak-db:
        condition: service_completed_successfully
    networks:
      - celine_security_net
    healthcheck:
      test: [ "CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000" ]
      interval: 5s
      timeout: 5s
      retries: 15
    ports:
      - 8080:8080

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.11.0
    restart: unless-stopped
    command:
      - "--config=/etc/oauth2-proxy/oauth2-proxy.cfg"
    volumes:
      - ./config/oauth2-proxy/oauth2-proxy.cfg:/etc/oauth2-proxy/oauth2-proxy.cfg:ro
    networks:
      - celine_security_net
    depends_on:
      keycloak:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "keycloak.celine.localhost:host-gateway"
    ports:
      - 4180:4180
