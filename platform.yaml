# Platform level of a CELINE realm — what `celine-policies keycloak bootstrap` owns.
#
# Deployment-agnostic: no hostname, credential, address or realm name. The realm is
# CELINE_KEYCLOAK_REALM, as for every command. Baked into the celine-policies image
# at /app/platform.yaml, beside clients.yaml.
#
# `bootstrap` writes only the keys named here and leaves every other realm key alone.
# Removing a key stops `bootstrap` owning it; it does not reset the realm's value.
#
# Not accepted here, on purpose:
#   smtpServer           a credential; bootstrap applies it from CELINE_KEYCLOAK_SMTP_*
#   bruteForceProtected  CELINE_KEYCLOAK_BRUTE_FORCE_ENABLED (on, and off when ENV is dev)
#   verifyEmail          the invitation already verifies; turning it on would stop every
#                        existing account with emailVerified: false at its next sign-in
#   passwordPolicy       Keycloak's default
#
# A deployment may overlay `realm_settings.supportedLocales` and `platform_admin.users` only
# (`bootstrap --overlay`).
# A deployment may override most values from the environment, CELINE_KEYCLOAK_PLATFORM_<KEY>
# (`loginTheme` -> CELINE_KEYCLOAK_PLATFORM_LOGIN_THEME); `null` stops bootstrap managing the
# key. Which keys: ENV_OVERRIDABLE_SETTINGS in src/celine/policies/cli/keycloak/platform.py.

realm_settings:
  # Features other levels depend on. `sync-orgs` and `sync-users` refuse a realm
  # without organizations; `sync` refuses to grant admin_permissions on a realm
  # without fine-grained admin permissions.
  organizationsEnabled: true
  adminPermissionsEnabled: true

  # Sign-in
  editUsernameAllowed: false
  registrationAllowed: false
  resetPasswordAllowed: true
  loginWithEmailAllowed: true
  duplicateEmailsAllowed: false

  # Languages. The provisioning service writes a user's `locale`, which Keycloak drops
  # with a 201 unless internationalization is on. `rec` ships it, en and es only.
  internationalizationEnabled: true
  supportedLocales: [it, en, es]
  defaultLocale: it

  # Themes. `bootstrap` refuses a theme the server does not list: Keycloak itself
  # accepts an unknown one and falls back to its own emails without a word. A Keycloak
  # without `rec` sets CELINE_KEYCLOAK_PLATFORM_LOGIN_THEME / _EMAIL_THEME to `null`.
  loginTheme: rec
  emailTheme: rec

  # Tokens and sessions, in seconds (the values infra's realm template has always set)
  accessTokenLifespan: 3600
  accessTokenLifespanForImplicitFlow: 3600
  ssoSessionIdleTimeout: 86400
  ssoSessionMaxLifespan: 86400

  # Emailed links, in seconds
  actionTokenGeneratedByAdminLifespan: 604800   # 7 days, the invitation
  actionTokenGeneratedByUserLifespan: 3600      # 1 hour, forgot-password

  # Brute-force tuning. Whether protection is on at all is CELINE_KEYCLOAK_BRUTE_FORCE_ENABLED.
  # `failureFactor` is Keycloak's "max login failures". Infra's template also writes a
  # `maxLoginFailures`, which no Keycloak realm has (26.7.3 answers a PUT naming it with 400).
  permanentLockout: false
  failureFactor: 5
  waitIncrementSeconds: 60
  quickLoginCheckMilliSeconds: 1000
  minimumQuickLoginWaitSeconds: 60
  maxFailureWaitSeconds: 900

# The platform-wide grant: exactly one, a realm role (ADR-0012, REQ-0011). Every service reads
# it from `realm_access.roles` under this name (celine-sdk PLATFORM_ADMIN_ROLE), so the name is
# fixed: bootstrap refuses any other. It is held directly by the operator realm admin
# (CELINE_KEYCLOAK_REALM_ADMIN_*) and by the users listed here, never through a group or a
# composite role. Organization groups (admins > managers > editors > viewers) are the other
# level and are valid only inside their organization.
#
# `users` is empty in the image, which names no account. A deployment lists its own platform
# administrators in its overlay; a user the list names who does not exist yet is reported.
platform_admin:
  role: platform-admin
  users: []

# What the platform level used to declare and no longer grants anything (ADR-0012,
# REQ-0012). bootstrap deletes each one the realm holds, with its memberships and role
# mappings, on every run. Top-level realm groups only: an organization's group of the same
# name is never touched.
retired:
  realm_groups: [/admins, /managers, /editors, /viewers]
  realm_roles: [admin, manager, editor, viewer]
