realm: celine

# =============================================================================
# WHAT THIS FILE DECLARES
# =============================================================================
# celine's own services, and nothing else. A realm may be declared by more than
# one file (`keycloak sync <base> --overlay <file>`), and this is the base: it
# is complete on its own and syncing it alone is a correct, whole celine realm.
#
# **The dataspace is optional.** Where one is deployed, two further files are
# passed and neither is duplicated here:
#
#   clients.ds-host.yaml   ours — the grants celine adds to ds's clients
#   <ds>/clients.yaml      ds's — it owns those clients and its own vocabulary
#
#   celine-policies keycloak sync clients.yaml \
#       --overlay clients.ds-host.yaml --overlay /path/to/ds/clients.yaml
#
# Nothing about the dataspace appears below. This file used to carry a
# hand-pasted copy of ds's declaration, and the copy drifted — see
# docs/decisions/ADR-0001.
# =============================================================================

# Client ID of the oauth2-proxy Keycloak client.
# The sync tool adds audience mappers for every service client (those with a
# scopes_prefix) so that user JWTs issued through oauth2-proxy carry all
# service audiences and pass audience validation on each service.
oauth2_proxy_client: oauth2_proxy

# =============================================================================
# SCOPES
# =============================================================================
# Convention: {service}.{resource}.{action} or {service}.{action}
# Special: {service}.admin grants full access to that service
# Service prefix always matches the suffix of svc-{service} client_id
# =============================================================================

scopes:
  # Digital Twin
  - name: digital-twin.admin
    description: Full access to Digital Twin service
  - name: digital-twin.values.read
    description: Read digital twin values
  - name: digital-twin.values.write
    description: Write digital twin values
  - name: digital-twin.simulation.read
    description: Read simulation data
  - name: digital-twin.simulation.write
    description: Write simulation data
  - name: digital-twin.simulation.run
    description: Execute simulations
  - name: digital-twin.app.run
    description: Execute digital twin apps

  # Pipelines
  - name: pipelines.admin
    description: Full access to Pipeline service
  - name: pipelines.runs.read
    description: Read pipeline runs
  - name: pipelines.runs.write
    description: Update pipeline runs
  - name: pipelines.job.read
    description: Read job details
  - name: pipelines.job.write
    description: Modify job configuration

  # Dataset
  - name: dataset.admin
    description: Full access to Dataset service (includes restricted datasets)
  - name: dataset.query
    description: Execute dataset queries
  - name: dataset.read
    description: Read dataset metadata and schema
  - name: dataset.write
    description: Write dataset data

  # REC Registry
  # `rec-registry.admin` satisfies every grant below through the admin-override
  # rule ({service}.admin covers {service}.*), so it stays a superset — but a
  # service account should hold the actions it calls, not the superset.
  - name: rec-registry.admin
    description: Full administrative access to the registry
  - name: rec-registry.read
    description: Read communities, members, assets and delivery points
  - name: rec-registry.members.write
    description: Create and update members, their delivery points and status
  - name: rec-registry.members.purge
    description: Permanently erase a member and its assets (erasure requests)
  - name: rec-registry.assets.write
    description: Create, update and delete member assets
  - name: rec-registry.community.write
    description: Update community metadata, areas and topology
  - name: rec-registry.import
    description: Permission to import into the registry
  - name: rec-registry.export
    description: Permission to export from the registry
  - name: rec-registry.lookup
    description: Permission to lookup data

  # REC Onboarding
  # The console's authorization is primarily *group*-based: a REC operator is
  # authorised by membership of the community's Keycloak organization plus one of
  # the admins/managers/editors/viewers org groups, and carries no scope. These
  # scopes exist for the other subject type — service accounts and the CLI, which
  # have no organization and so must state their intent explicitly. Every one of
  # them is satisfied by `onboarding.admin` through the admin-override rule.
  - name: onboarding.admin
    description: Full administrative access to the onboarding console API
  - name: onboarding.recs.read
    description: List the communities the caller may administer
  - name: onboarding.submissions.read
    description: Read submissions, with fiscal code and POD masked
  - name: onboarding.submissions.reveal
    description: Unmask a submission's fiscal code and POD (each reveal is audit-logged)
  - name: onboarding.submissions.write
    description: Edit submission fields and operator notes
  - name: onboarding.submissions.review
    description: Drive the review state machine (take in charge, approve, reject, reopen)
  # Separate from .review on purpose, mirroring rec-registry.members.purge:
  # rejecting somebody is recoverable, erasing them is not, and the two must not
  # become grantable together by accident.
  - name: onboarding.submissions.purge
    description: GDPR erasure of a submission, its files and its enablement state
  - name: onboarding.enablement.retry
    description: Re-run a failed enablement step for an approved participant
  # Reversal is admin-only for the same reason: it revokes a credential and
  # deletes a registry member.
  - name: onboarding.enablement.revoke
    description: Reverse enablement — revoke the credential, membership and login
  - name: onboarding.audit.read
    description: Read a community's onboarding audit trail
  - name: onboarding.export
    description: Export submissions or consented supply points

  # Nudging
  - name: nudging.admin
    description: Admin nudging
  - name: nudging.ingest
    description: Send notifications
  - name: nudging.analytics.read
    description: Read privacy-safe aggregate nudging analytics

  # Flexibility API
  - name: flexibility.admin
    description: Full access to the Flexibility API
  - name: flexibility.commitments.read
    description: Read flexibility commitments (service-to-service)
  - name: flexibility.commitments.write
    description: Write and settle flexibility commitments (service-to-service)
  - name: flexibility.commitments.export
    description: Export flexibility commitments (service-to-service)

  # Flexibility events (MQTT)
  - name: flexibility.committed.write
    description: Publish flexibility commitment events to MQTT
  - name: flexibility.committed.read
    description: Subscribe to flexibility commitment events from MQTT

  # Grid API
  - name: grid.read
    description: Read DT grid resilience data (maps, trends, distributions)
  - name: grid.alerts.read
    description: Read own alert rules and notification settings
  - name: grid.alerts.write
    description: Create, update, and delete own alert rules and notification settings
  - name: grid.admin
    description: Full access to the Grid API (all of the above, cross-user)

  # REC Manager Dashboard
  - name: community.read
    description: Read aggregate REC manager data
  - name: community.devices.read
    description: Read technical device-level data without participant identity
  - name: community.nudging.read
    description: Read aggregate nudging performance
  - name: community.alerts.write
    description: Manage and acknowledge REC alerts
  - name: community.objectives.write
    description: Manage REC objectives

  # MLflow
  - name: mlflow.admin
    description: Full access to MLflow (experiments, models, runs)
  - name: mlflow.read
    description: Read-only access to MLflow (experiments, runs, artifacts)

  # MQTT
  - name: mqtt.admin
    description: MQTT superuser access

# =============================================================================
# CLIENTS
# =============================================================================
# Each client gets scopes for:
#   1. Its own resources (what it manages) — declared via scopes_prefix
#   2. Dependencies (other services it needs to call)
#
# scopes_prefix: declares ownership of a scope family. The CLI uses this to:
#   - Validate that "own" scopes belong to the right client
#   - Automatically add audience mappers on clients that reference foreign scopes
#
# Clients without scopes_prefix (mqtt, celine-cli) are exempt from audience mapping.
# =============================================================================

clients:
  - client_id: svc-digital-twin
    name: Digital Twin Service
    secret: ${SVC_DT_SECRET:-svc-digital-twin}
    scopes_prefix: digital-twin
    default_scopes:
      # Own resources
      - digital-twin.admin
      # Dependencies
      - dataset.query # needs to read datasets  → aud: svc-dataset-api
      - pipelines.runs.read # subscribes to pipeline updates → aud: svc-pipelines
      - nudging.ingest # send notifications
      - rec-registry.lookup # lookup registry assets
      - flexibility.committed.read # subscribe to commitment events from MQTT
      # TODO: remove after Phase 4 — commitment publishing moves to svc-flexibility
      - flexibility.committed.write # publish commitment events to MQTT (legacy; svc-flexibility owns this now)

  - client_id: svc-pipelines
    name: Pipeline Orchestrator
    secret: ${SVC_PIPELINES_SECRET:-svc-pipelines}
    scopes_prefix: pipelines
    default_scopes:
      # Own resources
      - pipelines.runs.read
      - pipelines.runs.write
      - rec-registry.export
      - flexibility.commitments.export

  - client_id: svc-dataset-api
    name: Dataset API Service
    secret: ${SVC_DATASET_SECRET:-svc-dataset-api}
    scopes_prefix: dataset
    default_scopes:
      - dataset.admin # owns datasets

  - client_id: svc-nudging
    name: Nudging Service
    secret: ${SVC_NUDGING_SECRET:-svc-nudging}
    scopes_prefix: nudging
    default_scopes:
      - nudging.admin

  - client_id: svc-rec-registry
    name: REC Registry Service
    secret: ${SVC_REC_REGISTRY_SECRET:-svc-rec-registry}
    scopes_prefix: rec-registry
    default_scopes:
      # Own resources
      - rec-registry.admin

  # REC onboarding console API. Declared here so that (a) `onboarding.*` has an
  # owner and (b) oauth2-proxy mints `aud: svc-onboarding` on user JWTs — which is
  # what lets a REC operator's browser token authenticate against the console.
  #
  # This is deliberately NOT the same client as `svc-ds-onboarding` below. That one
  # is the onboarding service's *outbound* identity for the dataspace, and renaming
  # it would ripple through the ds deployment's env. One service, two clients: this
  # one for inbound audience validation, that one for outbound M2M. Consolidate
  # under this id when the ds env can be changed in the same pass.
  - client_id: svc-onboarding
    name: REC Onboarding Console
    secret: ${SVC_ONBOARDING_SECRET:-svc-onboarding}
    scopes_prefix: onboarding
    # Provisioning a participant's login is realm administration, and this is
    # where it is declared rather than granted by hand. `manage-members` on one
    # group is the whole grant: it covers creating a user *into* /participants,
    # reading, updating, disabling and password-resetting a member, and reaches
    # nothing outside the group. Realm-wide `manage-users` would have reached
    # every operator account in the realm to do the same job.
    #
    # See docs/decisions/ADR-0003 for why this rather than realm-management
    # roles, and for what `../onboarding` must do to use it.
    # The group name must not be one of the role-hierarchy names this tool also
    # creates (admins, managers, editors, viewers — see ROLE_HIERARCHY). Those
    # are operator roles, and onboarding's access.rego grants a *realm*-level
    # one platform-wide with no organization check: `viewers` is the least
    # privileged of them and still reads every REC's submissions and audit
    # trail. `participants` appears in no capability table, which is the point.
    admin_permissions:
      groups:
        - path: /participants
          scopes:
            # manage-members and manage-membership are a pair, and creating a
            # participant needs both: one authorises making the user, the other
            # authorises putting them in the group. Granted either one alone,
            # Keycloak creates the permission happily and refuses every
            # creation with a 403. Measured, not assumed — see the store's
            # knowledge/fine-grained-admin-permissions.md.
            - manage-members
            - manage-membership
            - view-members
            # And `view`, without which the grant cannot resolve the group it
            # administers: the three member scopes leave `group-by-path` and
            # `GET /groups/{id}` both 403, and every member call is addressed by
            # that id. Creating a participant works and finding one never does.
            - view
    default_scopes:
      # Own resources — REC operators get their capabilities from org group
      # membership, not from scopes, via the oauth2-proxy audience mapper.
      - onboarding.admin

  # The `onboarding-cli` review/enablement commands. Holds the superset because it
  # is the break-glass and e2e driver; a narrower client is what a scheduled job
  # should use.
  - client_id: svc-onboarding-cli
    name: REC Onboarding CLI
    secret: ${SVC_ONBOARDING_CLI_SECRET:-svc-onboarding-cli}
    # No scopes_prefix — it owns nothing, it only calls.
    extra_audiences:
      - svc-onboarding
    default_scopes:
      - onboarding.admin

  - client_id: svc-flexibility
    name: Flexibility API Service
    secret: ${SVC_FLEXIBILITY_SECRET:-svc-flexibility}
    scopes_prefix: flexibility
    default_scopes:
      # Own resources
      - flexibility.admin
      # Dependencies
      - digital-twin.values.read # fetch rec_flexibility_windows + rec_gamification_summary via DT
      - dataset.query # token passthrough DT→dataset-api for internal datasets (rec_gamification_summary)
      - nudging.ingest # send flexibility_reminder + flexibility_opportunity nudges
      - rec-registry.lookup # lookup community members for opportunity nudges
      - flexibility.committed.write # publish flexibility.committed events to MQTT
      - pipelines.runs.read # subscribe to pipeline run completion events on MQTT

  - client_id: svc-grid
    name: Grid API Service
    secret: ${SVC_GRID_SECRET:-svc-grid}
    scopes_prefix: grid
    default_scopes:
      # Own resources — users get grid.read / grid.alerts.* via oauth2-proxy audience mapper
      - grid.admin
      # Dependencies (service-to-service outbound)
      - digital-twin.values.read # fetch wind/heat alert distributions → aud: svc-digital-twin
      - dataset.query # DT passes svc-grid token through to dataset-api → aud: svc-dataset-api
      - nudging.ingest # send grid_alert nudges
      - pipelines.runs.read # subscribe to pipeline run completion events on MQTT

  - client_id: svc-community
    name: REC Manager Dashboard BFF
    secret: ${SVC_COMMUNITY_SECRET:-svc-community}
    scopes_prefix: community
    default_scopes:
      # Own resources
      - community.read
      - community.devices.read
      - community.nudging.read
      - community.alerts.write
      - community.objectives.write
      # Dependencies: the DT forwards this token to governed dataset queries.
      - digital-twin.values.read
      - dataset.query
      # Aggregate administrative population; participant records never leave the BFF process.
      - rec-registry.read
      # Aggregate-only operational metrics; nudging-tool retains participant records.
      - nudging.analytics.read

  - client_id: svc-webapp
    name: Webapp BFF Service
    secret: ${SVC_WEBAPP_SECRET:-svc-webapp}
    scopes_prefix: webapp
    default_scopes:
      - nudging.ingest # schedule flexibility reminders via nudging API

  - client_id: svc-forecast
    name: Forecast Service
    secret: ${SVC_FORECAST_SECRET:-svc-forecast}
    scopes_prefix: mlflow
    default_scopes:
      - mlflow.admin

  - client_id: celine-cli
    name: CELINE Admin CLI
    secret: ${CELINE_ADMIN_CLI_SECRET:-celine-cli}
    extra_audiences:
      - svc-digital-twin
      - svc-dataset-api
      - svc-rec-registry
      - svc-nudging
      - svc-flexibility
      - svc-grid
      - svc-onboarding
      - oauth2_proxy
    # No scopes_prefix — sudo client, exempt from audience mapper generation
    default_scopes:
      - digital-twin.admin
      - pipelines.admin
      - dataset.admin
      - mlflow.admin
      - mqtt.admin
      - rec-registry.admin
      - nudging.admin
      - onboarding.admin
