realm: celine-warehouse

# =============================================================================
# WHAT THIS FILE DECLARES
# =============================================================================
# The realm of the pipeline operators: the environment that runs the data
# pipelines and their operator UIs (Prefect, Marquez), and no CELINE service.
# Its only users are the platform admins.
#
# It is a base declaration, like `clients.yaml`, and replaces it for this realm:
#
#   celine-policies keycloak sync clients.warehouse.yaml --realm <realm>
#
# It is not an overlay. An overlay adds to `clients.yaml`, and syncing that
# file here would create every service client of the platform with nothing
# behind it: credentials with no purpose.
#
# The realm itself, its `platform-admin` role, the admin second factor and the
# operator credential (`celine-admin-cli`) are `keycloak bootstrap`'s
# (platform.yaml), as for every realm. The `realm:` above only answers a run
# nobody aimed: --realm and the settings come first.
# =============================================================================

oauth2_proxy_client: oauth2_proxy

clients:
  # ---------------------------------------------------------------------------
  # The browser login: one oauth2-proxy per operator UI signs the platform
  # admins in through it and admits `role:platform-admin` only. Same settings
  # as in `clients.yaml`, without the REC Manager scopes (no community service
  # here) and with the operator UIs as its hosts. CELINE_DOMAIN and
  # CELINE_URL_SCHEME aim them per deployment; the secret must equal the one
  # the oauth2-proxies are configured with.
  # ---------------------------------------------------------------------------
  - client_id: oauth2_proxy
    name: oauth2_proxy
    description: OIDC client for the operator UIs' oauth2-proxy
    secret: ${OAUTH2_PROXY_CLIENT_SECRET:-oauth2_proxy}
    service_account_enabled: false
    # `roles` is how `platform-admin` reaches the token (realm_access.roles).
    default_scopes:
      - web-origins
      - acr
      - profile
      - roles
      - email
    browser:
      redirect_uris:
        - ${CELINE_URL_SCHEME:-http}://prefect.${CELINE_DOMAIN:-celine.localhost}/*
        - ${CELINE_URL_SCHEME:-http}://marquez.${CELINE_DOMAIN:-celine.localhost}/*
      web_origins:
        - "+"
      implicit_flow: true
      direct_access_grants: true
      access_token_lifespan: 1800
